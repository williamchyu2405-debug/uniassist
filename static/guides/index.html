<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Guides — Gallery</title>
<meta name="description" content="A gallery of weekly university study guides — each lecture decoded slide-by-slide with real figures, plain-language explanations and self-tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5F0;--paper-2:#FEFDFB;--ink:#1C2321;--ink-soft:#55605C;--ink-faint:#8A938E;
  --teal:#0E7C7B;--teal-deep:#0A5C5B;--teal-wash:#E4EFEE;
  --oxblood:#8C2B2B;--oxblood-deep:#6B1F1F;--oxblood-wash:#F2E6E4;
  --ochre:#B08512;--ochre-deep:#8A6608;--ochre-wash:#F4EBD4;
  --rule:#DAD5CB;--rule-soft:#E7E3DA;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none !important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,56px) 120px}
a{color:inherit}

/* ---------- Hero ---------- */
.hero{padding:64px 0 30px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:16px}
h1.title{font-family:"Newsreader",serif;font-weight:500;font-size:clamp(38px,6.4vw,62px);line-height:1.0;letter-spacing:-.015em;margin:0 0 16px}
h1.title .thin{color:var(--ink-soft);font-style:italic;font-weight:400}
.lede{font-size:18px;color:var(--ink-soft);max-width:660px;margin:0}
.hero .meta{margin-top:26px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-faint);letter-spacing:.03em;display:flex;gap:22px;flex-wrap:wrap}
.hero .meta b{color:var(--teal-deep);font-weight:500}

/* ---------- Controls ---------- */
.controls{position:sticky;top:0;z-index:10;background:var(--paper);padding:20px 0 16px;margin-bottom:6px;border-bottom:1px solid var(--rule-soft);display:flex;gap:16px 22px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft);background:transparent;border:1px solid var(--rule);border-radius:20px;padding:6px 14px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--teal);color:var(--teal-deep)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.search{margin-left:auto;position:relative}
.search input{font-family:"IBM Plex Sans",sans-serif;font-size:14.5px;color:var(--ink);background:var(--paper-2);border:1px solid var(--rule);border-radius:20px;padding:8px 16px 8px 34px;width:min(280px,60vw);transition:border-color .15s}
.search input:focus{outline:none;border-color:var(--teal)}
.search input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.search::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:16px}

.count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:22px 0 18px}

/* ---------- Grid + cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px}
.card{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper-2);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(28,35,33,.5);border-color:var(--rule)}
.card:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.cover{position:relative;aspect-ratio:16/9;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.cover.teal{background:linear-gradient(135deg,var(--teal) 0%,var(--teal-deep) 100%)}
.cover.oxblood{background:linear-gradient(135deg,var(--oxblood) 0%,var(--oxblood-deep) 100%)}
.cover.ochre{background:linear-gradient(135deg,var(--ochre) 0%,var(--ochre-deep) 100%)}
.cover .glyph{position:absolute;right:-8px;bottom:-40px;font-family:"Newsreader",serif;font-size:190px;line-height:1;opacity:.14;pointer-events:none;user-select:none}
.cover .unit{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;letter-spacing:.12em;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:5px;align-self:flex-start;backdrop-filter:blur(2px)}
.cover .subj{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;position:relative;z-index:1}
.badge{position:absolute;top:14px;right:14px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--paper);color:var(--ink);padding:4px 9px;border-radius:20px;z-index:2}

.body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.body .wk{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px}
.body h2{font-family:"Newsreader",serif;font-weight:600;font-size:22px;line-height:1.14;letter-spacing:-.005em;margin:0 0 10px;color:var(--ink)}
.body .blurb{font-size:14.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;flex:1}
.body .foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--rule-soft)}
.body .date{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em}
.body .open{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;color:var(--teal-deep);letter-spacing:.02em}
.card:hover .open{color:var(--teal)}
.card:hover .open .arw{transform:translateX(3px)}
.open .arw{display:inline-block;transition:transform .18s ease}

/* ---------- states ---------- */
.state{padding:60px 0;text-align:center;color:var(--ink-soft);font-size:16px}
.state code{font-family:"IBM Plex Mono",monospace;background:var(--rule-soft);padding:2px 7px;border-radius:5px;font-size:13.5px}
.foot-note{margin-top:64px;padding-top:24px;border-top:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;line-height:1.7}

@media (max-width:640px){
  .hero{padding:44px 0 24px}
  .controls{gap:12px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .grid{grid-template-columns:1fr;gap:20px}
}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">Study Guides · Atlas</div>
    <h1 class="title">Weekly Study <span class="thin">Guides</span></h1>
    <p class="lede">Every university lecture decoded slide-by-slide — the real figures, plain-language explanations, mnemonics and self-tests. One place, newest first.</p>
    <div class="meta" id="heroMeta" aria-hidden="true"></div>
  </header>

  <nav class="controls" aria-label="Filter guides">
    <div class="chips" id="chips" role="group" aria-label="Filter by unit"></div>
    <div class="search">
      <label for="search" class="visually-hidden">Search guides by title, unit or topic</label>
      <input type="search" id="search" placeholder="Search title, unit, topic…" autocomplete="off">
    </div>
  </nav>

  <p class="count" id="count" role="status" aria-live="polite"></p>

  <main>
    <div class="grid" id="grid"></div>
    <div class="state" id="state" hidden></div>
  </main>

  <noscript>
    <p class="state">This gallery needs JavaScript to list the guides. You can still open a guide directly, e.g. <code>/static/guides/cell_organisation_study_guide.html</code>.</p>
  </noscript>

  <p class="foot-note" id="footNote"></p>

</div>

<script>
(function(){
  "use strict";
  var MANIFEST = "/static/guides/guides.json";
  var BASE = "/static/guides/";
  var ACCENTS = {teal:"teal", oxblood:"oxblood", ochre:"ochre"};
  var GLYPHS = {teal:"§", oxblood:"¶", ochre:"※"};

  var gridEl  = document.getElementById("grid");
  var stateEl = document.getElementById("state");
  var chipsEl = document.getElementById("chips");
  var countEl = document.getElementById("count");
  var searchEl= document.getElementById("search");
  var metaEl  = document.getElementById("heroMeta");
  var footEl  = document.getElementById("footNote");

  var GUIDES = [];
  var activeUnit = "all";
  var query = "";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function fmtDate(iso){
    var d = new Date(iso + (/^\d{4}-\d{2}-\d{2}$/.test(iso) ? "T00:00:00" : ""));
    if (isNaN(d)) return esc(iso);
    return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  }

  function accentClass(a){ return ACCENTS[a] || "teal"; }

  function showState(html){ stateEl.innerHTML = html; stateEl.hidden = false; gridEl.hidden = true; }
  function hideState(){ stateEl.hidden = true; gridEl.hidden = false; }

  function buildChips(){
    var units = [];
    GUIDES.forEach(function(g){ if (g.unit && units.indexOf(g.unit) === -1) units.push(g.unit); });
    units.sort();
    var all = [{key:"all", label:"All"}].concat(units.map(function(u){ return {key:u, label:u}; }));
    chipsEl.innerHTML = all.map(function(c){
      return '<button class="chip" type="button" data-unit="'+esc(c.key)+'" aria-pressed="'+(c.key===activeUnit)+'">'+esc(c.label)+'</button>';
    }).join("");
    Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(btn){
      btn.addEventListener("click", function(){
        activeUnit = btn.getAttribute("data-unit");
        Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(b){
          b.setAttribute("aria-pressed", String(b === btn));
        });
        render();
      });
    });
  }

  function matches(g){
    if (activeUnit !== "all" && g.unit !== activeUnit) return false;
    if (!query) return true;
    var hay = [g.title,g.subject,g.unit,g.blurb,("week "+g.week)].join(" ").toLowerCase();
    return query.split(/\s+/).every(function(t){ return hay.indexOf(t) !== -1; });
  }

  function cardHTML(g, isLatest){
    var acc = accentClass(g.accent);
    var glyph = GLYPHS[g.accent] || "§";
    var href = BASE + encodeURIComponent(g.file);
    var wk = (g.week != null ? "Week "+esc(g.week) : "");
    return '<a class="card" href="'+href+'" aria-label="Open study guide: '+esc(g.title)+' — '+esc(g.unit)+(wk?", "+esc(wk):"")+'">'
      + '<div class="cover '+acc+'">'
      +   (isLatest ? '<span class="badge">Latest</span>' : '')
      +   '<span class="glyph" aria-hidden="true">'+glyph+'</span>'
      +   '<span class="unit">'+esc(g.unit||"")+'</span>'
      +   '<span class="subj">'+esc(g.subject||"")+'</span>'
      + '</div>'
      + '<div class="body">'
      +   '<div class="wk">'+wk+'</div>'
      +   '<h2>'+esc(g.title)+'</h2>'
      +   '<p class="blurb">'+esc(g.blurb||"")+'</p>'
      +   '<div class="foot">'
      +     '<span class="date">'+fmtDate(g.date)+'</span>'
      +     '<span class="open">Open guide <span class="arw">→</span></span>'
      +   '</div>'
      + '</div>'
      + '</a>';
  }

  function render(){
    var newestDate = GUIDES.length ? GUIDES[0].date : null;
    var list = GUIDES.filter(matches);
    countEl.textContent = list.length + (list.length === 1 ? " guide" : " guides")
      + (activeUnit !== "all" ? " · " + activeUnit : "")
      + (query ? ' · "' + query + '"' : "");
    if (!list.length){
      showState('No guides match'+(query?' “'+esc(query)+'”':'')+'. Try clearing the filter or search.');
      return;
    }
    hideState();
    gridEl.innerHTML = list.map(function(g){
      return cardHTML(g, g.date === newestDate && activeUnit === "all" && !query);
    }).join("");
  }

  function boot(g){
    GUIDES = (g||[]).slice().sort(function(a,b){
      return String(b.date).localeCompare(String(a.date));
    });
    if (!GUIDES.length){
      showState("No guides yet. Add one to <code>guides.json</code>.");
      countEl.textContent = "";
      return;
    }
    var unitCount = GUIDES.map(function(x){return x.unit;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;}).length;
    metaEl.innerHTML = '<span><b>'+GUIDES.length+'</b> guides</span><span><b>'+unitCount+'</b> units</span><span>Updated <b>'+fmtDate(GUIDES[0].date)+'</b></span>';
    footEl.textContent = "Bookmark this page — it always shows the latest guides. " + GUIDES.length + " guides across " + unitCount + " units.";
    buildChips();
    render();
  }

  searchEl.addEventListener("input", function(){ query = searchEl.value.trim().toLowerCase(); render(); });

  fetch(MANIFEST, {cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(boot)
    .catch(function(e){
      showState('Could not load the guide list (<code>'+esc(String(e.message||e))+'</code>). Check that <code>guides.json</code> is present.');
      countEl.textContent = "";
    });
})();
</script>
</body>
</html>
